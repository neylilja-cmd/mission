name: mission_reward_app
description: Personal mission and reward point manager
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_picker: ^10.1.9
  intl: ^0.20.2
  path_provider: ^2.1.5
  image: ^4.5.4
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    # Noto Sans JP（SIL Open Font License）。オフラインでも日本語を表示できるよう同梱する。
    # 容量を抑えるため、かな・英数記号と JIS 第1・第2水準漢字に絞っている。
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
